services:
  renewx:
    build: .
    container_name: renewx-node
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
